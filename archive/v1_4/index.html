<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face rPPG v1.4</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="permissionModal" class="permission-modal" role="dialog" aria-modal="true"
      aria-labelledby="permissionTitle">
      <div class="permission-card">
        <h2 id="permissionTitle">Camera Permission</h2>
        <p>
          このサイトは脈波を計測するためにカメラを使用します。<br />
          <br />
          This site uses your camera to measure pulse waves.
        </p>
        <button id="permissionButton" class="primary-button">OK</button>
      </div>
    </div>

    <main class="app-shell">
      <header class="app-header">
        <div class="header-copy">
          <div class="title-line">
            <h1>Face rPPG <span class="version-chip">v1.4</span></h1>
            <p class="subtitle">Camera-based Remote Photoplethysmography</p>
          </div>
        </div>
      </header>

      <section class="status-grid">
        <article class="status-card">
          <h2>BPM</h2>
          <p id="bpmValue" class="status-value">--</p>
          <p class="status-note">推定心拍数</p>
        </article>
        <article class="status-card">
          <h2>FPS</h2>
          <p id="fpsValue" class="status-value">--</p>
          <p class="status-note">描画更新レート</p>
        </article>
        <article class="status-card">
          <h2>Resolution</h2>
          <p id="resolutionValue" class="status-value small">--</p>
          <p class="status-note">カメラ入力サイズ</p>
        </article>
        <article class="status-card">
          <h2>Quality</h2>
          <p id="qualityValue" class="status-value">--</p>
          <p class="status-note">ピーク強度 / スペクトル中央値</p>
        </article>
      </section>

      <section id="contentGrid" class="content-grid">
        <article class="panel video-panel">
          <div class="panel-header chart-header">
            <h2>Camera</h2>
            <div class="series-controls" aria-label="Camera overlay visibility">
              <label class="series-toggle series-toggle-face">
                <input id="showFaceBox" type="checkbox" checked />
                Face box
              </label>
              <label class="series-toggle series-toggle-roi">
                <input id="showRoiBoxes" type="checkbox" checked />
                ROI
              </label>
            </div>
          </div>
          <div class="video-stage-wrap">
            <div class="video-stage">
              <video id="video" playsinline muted></video>
              <canvas id="overlay"></canvas>
            </div>
          </div>
          <!-- <p class="panel-note">顔全体と、額・左右頬・鼻横・あご周辺など複数 ROI を重ね描画します。</p> -->
        </article>

        <div id="columnResizer" class="column-resizer" role="separator" aria-orientation="vertical"
          aria-label="Camera and chart width resize" tabindex="0"></div>

        <div class="charts-column">
          <article class="panel chart-panel">
            <div class="panel-header chart-header">
              <h2>RGB Mean</h2>
              <div class="series-controls" aria-label="RGB Mean series visibility">
                <label class="series-toggle series-toggle-r">
                  <input id="showRgbR" type="checkbox" checked />
                  R
                </label>
                <label class="series-toggle series-toggle-g">
                  <input id="showRgbG" type="checkbox" checked />
                  G
                </label>
                <label class="series-toggle series-toggle-b">
                  <input id="showRgbB" type="checkbox" checked />
                  B
                </label>
              </div>
            </div>
            <div class="chart-wrap compact">
              <canvas id="rgbChart"></canvas>
            </div>
          </article>

          <article class="panel chart-panel wide">
            <div class="panel-header chart-header">
              <h2>rPPG Pulse Wave</h2>
              <div class="series-controls" aria-label="rPPG Pulse Wave series visibility">
                <label class="series-toggle series-toggle-raw">
                  <input id="showRppgRaw" type="checkbox" checked />
                  Raw
                </label>
                <label class="series-toggle series-toggle-pulse">
                  <input id="showRppgFiltered" type="checkbox" checked />
                  Pulse
                </label>
              </div>
            </div>
            <div class="chart-wrap">
              <canvas id="rppgChart"></canvas>
            </div>
          </article>
        </div>
      </section>

      <section class="panel settings-panel">
        <div class="panel-header settings-toggle" id="settingsToggle" role="button" tabindex="0" aria-expanded="true"
          aria-controls="settingsGrid">
          <h2>Parameters</h2>
          <span class="toggle-indicator" aria-hidden="true">▾</span>
        </div>
        <div id="settingsGrid" class="settings-grid">
          <label>
            Camera Resolution
            <select id="cameraResolutionSelect">
              <option value="max" selected>Max available</option>
            </select>
          </label>
          <label>
            Window (sec)
            <input id="windowSecInput" type="number" min="5" max="20" step="1" value="10" />
          </label>
          <label>
            Min BPM
            <input id="minBpmInput" type="number" min="30" max="120" step="1" value="45" />
          </label>
          <label>
            Max BPM
            <input id="maxBpmInput" type="number" min="90" max="220" step="1" value="180" />
          </label>
          <label>
            BPM Update Interval (sec)
            <input id="bpmIntervalInput" type="number" min="0.5" max="3.0" step="0.1" value="1.0" />
          </label>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>

</html>
